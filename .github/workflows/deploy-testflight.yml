name: Deploy to TestFlight

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build iOS & Upload to TestFlight
    runs-on: macos-14   # Apple Silicon runner with Xcode 15+

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Set up Node
      # -----------------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 3. Set up Rust toolchain + iOS targets
      # -----------------------------------------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # -----------------------------------------------------------------------
      # 4. Set up Ruby & Fastlane
      # -----------------------------------------------------------------------
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # -----------------------------------------------------------------------
      # 5. Install Apple certificates & provisioning profiles
      # -----------------------------------------------------------------------
      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          tmp="$(mktemp)"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$tmp"
          plist_file="$(mktemp).plist"
          security cms -D -i "$tmp" > "$plist_file"
          uuid="$(plutil -extract UUID raw "$plist_file")"
          cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/${uuid}.mobileprovision"
          echo "PROFILE_UUID=${uuid}" >> "$GITHUB_ENV"
          echo "Installed profile UUID=$uuid"
          rm -f "$tmp" "$plist_file"

      - name: Place App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # 6. Write environment variables for the build
      # -----------------------------------------------------------------------
      - name: Create .env
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          EOF

      # -----------------------------------------------------------------------
      # 7. Auto-increment build number (CFBundleVersion = GitHub run number)
      # -----------------------------------------------------------------------
      - name: Set build number
        run: |
          BUILD_NUM=${{ github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" \
            src-tauri/gen/apple/necro-dash_iOS/Info.plist
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 8. Build the Tauri iOS app
      # -----------------------------------------------------------------------
      - name: Archive Tauri iOS
        run: npx tauri ios build --export-method app-store-connect --archive-only
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: Export App Store IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          APPLE="src-tauri/gen/apple"
          ARCHIVE="$(find "$APPLE/build" -name '*.xcarchive' -print -quit)"
          if [ -z "$ARCHIVE" ] || [ ! -d "$ARCHIVE" ]; then
            echo "No xcarchive found"
            find "$APPLE" -name '*.xcarchive' -o -type d -name build | head -40
            exit 1
          fi

          DIST_ID="$(security find-identity -v -p codesigning | awk -F'"' '/Apple Distribution/{print $2; exit}')"
          if [ -z "$DIST_ID" ]; then
            echo "No Apple Distribution identity in keychain"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Using identity: $DIST_ID"
          echo "Archive: $ARCHIVE"

          EXPORT_OPTS="$(mktemp).plist"
          OUT_DIR="$APPLE/build/export"
          mkdir -p "$OUT_DIR"
          export DIST_ID
          python3 - "$EXPORT_OPTS" <<'PY'
          import plistlib, os, sys
          path = sys.argv[1]
          data = {
            "method": "app-store-connect",
            "signingStyle": "manual",
            "teamID": os.environ["APPLE_DEVELOPMENT_TEAM"],
            "signingCertificate": os.environ["DIST_ID"],
            "provisioningProfiles": {
              "com.necrodash.app": os.environ["PROFILE_UUID"],
            },
          }
          with open(path, "wb") as f:
            plistlib.dump(data, f)
          print("Wrote export options")
          PY

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$OUT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTS"

      # -----------------------------------------------------------------------
      # 9. Upload to TestFlight via App Store Connect API
      # -----------------------------------------------------------------------
      - name: Upload to TestFlight
        run: |
          IPA="$(find src-tauri/gen/apple/build -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No .ipa found under src-tauri/gen/apple/build"
            find src-tauri/gen/apple/build -type f | head -50
            exit 1
          fi
          echo "Uploading $IPA"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      # -----------------------------------------------------------------------
      # 10. Notify on success/failure
      # -----------------------------------------------------------------------
      - name: Notify success
        if: success()
        run: |
          echo "✅ Build ${{ env.BUILD_NUMBER }} successfully uploaded to TestFlight."

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ TestFlight deployment failed. Check the logs above."

